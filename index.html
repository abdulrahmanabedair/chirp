<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chirp — a tiny social app</title>
<style>
  :root{
    --bg:#f4f5f7; --surface:#fff; --border:#e4e6eb; --text:#14171a;
    --muted:#657786; --primary:#4f46e5; --primary-hover:#4338ca;
    --like:#e0245e; --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);line-height:1.45;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit;text-decoration:none;cursor:pointer}
  button{font-family:inherit;cursor:pointer}

  .nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .nav-inner{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
  .brand{font-weight:800;font-size:20px;color:var(--primary);display:flex;align-items:center;gap:6px}
  .brand-mark{font-size:22px}
  .nav-links{display:flex;gap:4px;margin-left:8px}
  .nav-link{padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px}
  .nav-link:hover{background:var(--bg);color:var(--text)}
  .nav-link.active{color:var(--primary)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}

  .container{width:100%;max-width:620px;margin:0 auto;padding:20px 16px 40px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px}

  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
    font-weight:700;flex-shrink:0;user-select:none}

  .composer{display:flex;gap:12px}
  .composer-body{flex:1}
  .composer-input{width:100%;border:none;resize:vertical;font-size:18px;font-family:inherit;
    outline:none;background:transparent;color:var(--text)}
  .composer-footer{display:flex;align-items:center;justify-content:flex-end;gap:14px;
    border-top:1px solid var(--border);padding-top:12px;margin-top:8px}
  .char-count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .char-count.over{color:var(--like);font-weight:700}

  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:999px;
    padding:9px 20px;font-weight:700;font-size:15px}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--primary);border:1px solid var(--primary);
    border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px}
  .btn-ghost:hover{background:rgba(79,70,229,.08)}
  .btn-small{background:var(--primary);color:#fff;border:none;border-radius:999px;
    padding:6px 14px;font-weight:600;font-size:13px}
  .btn-small:disabled{opacity:.5;cursor:not-allowed}

  .tabs{display:flex;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:4px;margin-bottom:14px}
  .tab{flex:1;border:none;background:transparent;padding:8px;border-radius:999px;
    font-weight:600;color:var(--muted);font-size:14px}
  .tab.active{background:var(--primary);color:#fff}

  .post{display:flex;gap:12px}
  .post-body{flex:1;min-width:0}
  .post-head,.comment-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .name{font-weight:700}
  .name:hover{text-decoration:underline}
  .muted{color:var(--muted);font-size:14px}
  .post-del{margin-left:auto;border:none;background:transparent;color:var(--muted);
    font-size:14px;padding:2px 6px;border-radius:6px}
  .post-del:hover{background:rgba(224,36,94,.1);color:var(--like)}
  .post-text{margin:6px 0 10px;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
  .post-actions{display:flex;gap:20px}
  .action{border:none;background:transparent;color:var(--muted);font-size:14px;
    padding:4px 6px;border-radius:8px;transition:color .15s}
  .action:hover{color:var(--primary)}
  .action.liked{color:var(--like)}

  .comments{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
  .comment{display:flex;gap:10px;margin-bottom:10px}
  .comment-body{flex:1}
  .comment-text{font-size:15px}
  .comment-form{display:flex;gap:8px;margin-top:8px}
  .comment-input{flex:1;border:1px solid var(--border);border-radius:999px;padding:8px 14px;
    font-size:14px;font-family:inherit;outline:none}
  .comment-input:focus{border-color:var(--primary)}

  .page-title{margin:4px 0 14px;font-size:22px}
  .search{width:100%;border:1px solid var(--border);border-radius:999px;padding:11px 16px;
    font-size:15px;font-family:inherit;outline:none;margin-bottom:14px;background:var(--surface)}
  .search:focus{border-color:var(--primary)}
  .user-card{display:flex;align-items:center;gap:12px}
  .user-card-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .user-card-bio{font-size:14px;color:var(--muted);margin-top:2px}

  .profile-header{display:flex;gap:16px;align-items:flex-start}
  .profile-meta{flex:1}
  .profile-name{margin:0;font-size:22px}
  .profile-bio{margin:8px 0}
  .profile-stats{display:flex;gap:18px;font-size:14px;color:var(--muted);margin-top:6px}
  .profile-stats strong{color:var(--text)}

  .empty{text-align:center;color:var(--muted);padding:40px 20px;background:var(--surface);
    border:1px dashed var(--border);border-radius:var(--radius)}
  .empty a{color:var(--primary);font-weight:600}
  .footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 16px;border-top:1px solid var(--border)}

  /* auth screen */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-card{width:100%;max-width:380px;margin:0;display:flex;flex-direction:column;gap:12px;padding:28px}
  .auth-brand{font-weight:800;font-size:24px;color:var(--primary);display:flex;align-items:center;gap:6px;justify-content:center}
  .auth-title{margin:2px 0 4px;font-size:20px;text-align:center}
  .auth-label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
  .auth-input{border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:15px;
    font-family:inherit;outline:none;background:var(--surface);color:var(--text)}
  .auth-input:focus{border-color:var(--primary)}
  .auth-submit{margin-top:6px;width:100%}
  .auth-switch{text-align:center;font-size:14px;color:var(--muted)}
  .auth-switch a{color:var(--primary);font-weight:700}
  .auth-error{background:rgba(224,36,94,.1);color:var(--like);border-radius:10px;
    padding:9px 12px;font-size:14px;font-weight:600;text-align:center}
  .auth-hint{font-size:12px;color:var(--muted);text-align:center;background:var(--bg);
    border-radius:10px;padding:9px 12px;line-height:1.6}
  .auth-reset{text-align:center;font-size:12px}
  .auth-reset a{color:var(--muted);text-decoration:underline}

  @media(max-width:500px){.nav-link{padding:6px 8px;font-size:14px}}
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";
/* ---------------- data layer (localStorage) ---------------- */
const STORAGE_KEY = "chirp.state.v3";

// Fresh, empty app: no accounts and no posts. The first person must sign up.
function seedState(){
  return {
    currentUserId: null, // null = logged out; the app opens on the sign-in screen
    users: [],
    posts: [],
  };
}

let state;
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ state = seedState(); save(); }
    else state = JSON.parse(raw);
  }catch(e){ state = seedState(); }
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

let idc = 0;
const makeId = p => `${p}_${Date.now().toString(36)}${idc++}`;
const getUser = id => state.users.find(u => u.id === id);
const getUserByHandle = h => state.users.find(u => u.handle.toLowerCase() === String(h).toLowerCase());
const me = () => getUser(state.currentUserId);

/* ---------------- actions ---------------- */
function addPost(text){
  const t = text.trim(); if(!t) return;
  state.posts.unshift({id:makeId("p"),authorId:state.currentUserId,text:t,createdAt:Date.now(),likes:[],comments:[]});
  commit();
}
function deletePost(id){ state.posts = state.posts.filter(p=>p.id!==id); commit(); }
function toggleLike(id){
  const p = state.posts.find(p=>p.id===id); if(!p) return;
  const i = p.likes.indexOf(state.currentUserId);
  if(i>=0) p.likes.splice(i,1); else p.likes.push(state.currentUserId);
  commit();
}
function addComment(id,text){
  const t = text.trim(); if(!t) return;
  const p = state.posts.find(p=>p.id===id); if(!p) return;
  p.comments.push({id:makeId("c"),authorId:state.currentUserId,text:t,createdAt:Date.now()});
  commit();
}
function toggleFollow(userId){
  if(userId===state.currentUserId) return;
  const u = me();
  const i = u.following.indexOf(userId);
  if(i>=0) u.following.splice(i,1); else u.following.push(userId);
  commit();
}
function resetAll(){ localStorage.removeItem(STORAGE_KEY); load(); location.hash="#/"; render(); }

/* ---------------- auth ---------------- */
// Returns an error string, or null on success.
function login(handle, password){
  const h = handle.trim().replace(/^@/, "").toLowerCase();
  if(!h || !password) return "Enter a handle and password.";
  const u = getUserByHandle(h);
  if(!u) return "No account with that handle.";
  if(u.password !== password) return "Wrong password.";
  ui.authError = "";
  state.currentUserId = u.id;
  location.hash = "#/";
  commit();
  return null;
}

function signup(name, handle, password){
  const n = name.trim();
  const h = handle.trim().replace(/^@/, "").toLowerCase();
  if(!n) return "Enter a display name.";
  if(!/^[a-z0-9_]{2,20}$/.test(h)) return "Handle must be 2–20 chars: letters, numbers, or _.";
  if(password.length < 4) return "Password must be at least 4 characters.";
  if(getUserByHandle(h)) return "That handle is already taken.";
  const user = {id:makeId("u"), handle:h, name:n, password, bio:"", following:[]};
  ui.authError = "";
  state.users.push(user);
  state.currentUserId = user.id;
  location.hash = "#/";
  commit();
  return null;
}

function logout(){
  state.currentUserId = null;
  ui.openComments.clear(); ui.tab = "following"; ui.search = "";
  location.hash = "#/";
  commit();
}

/* ---------------- helpers ---------------- */
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "now";
  const m = Math.floor(s/60); if(m<60) return m+"m";
  const h = Math.floor(m/60); if(h<24) return h+"h";
  const d = Math.floor(h/24); if(d<7) return d+"d";
  return new Date(ts).toLocaleDateString();
}
function colorFrom(str){
  let hash=0; for(let i=0;i<str.length;i++) hash = str.charCodeAt(i)+((hash<<5)-hash);
  return `hsl(${Math.abs(hash)%360},62%,55%)`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name){ return (name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function avatar(user,size=44){
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${colorFrom(user.handle)};font-size:${size*0.4}px">${esc(initials(user.name))}</div>`;
}

/* ---------------- routing ---------------- */
function route(){
  const h = location.hash.replace(/^#/, "") || "/";
  const parts = h.split("/").filter(Boolean); // e.g. ["u","ada"]
  if(parts[0]==="explore") return {page:"explore"};
  if(parts[0]==="u" && parts[1]) return {page:"profile", handle:decodeURIComponent(parts[1])};
  return {page:"feed"};
}

/* transient UI state (which post has comments open, feed tab, search text) */
const ui = { openComments:new Set(), tab:"following", search:"", authMode:"signin", authError:"" };

/* ---------------- views ---------------- */
function authView(){
  const signup = ui.authMode === "signup";
  const err = ui.authError ? `<div class="auth-error">${esc(ui.authError)}</div>` : "";
  return `<div class="auth-wrap">
    <form class="card auth-card" data-auth>
      <div class="auth-brand"><span class="brand-mark">🐦</span> Chirp</div>
      <h2 class="auth-title">${signup ? "Create your account" : "Sign in"}</h2>
      ${err}
      ${signup ? `<label class="auth-label">Display name
        <input class="auth-input" name="name" placeholder="Ada Lovelace" autocomplete="off" />
      </label>` : ""}
      <label class="auth-label">Handle
        <input class="auth-input" name="handle" placeholder="ada" autocomplete="off" />
      </label>
      <label class="auth-label">Password
        <input class="auth-input" name="password" type="password" placeholder="••••••" />
      </label>
      <button type="submit" class="btn-primary auth-submit">${signup ? "Sign up" : "Sign in"}</button>
      <div class="auth-switch">
        ${signup
          ? `Already have an account? <a data-authmode="signin">Sign in</a>`
          : `New here? <a data-authmode="signup">Create an account</a>`}
      </div>
    </form>
  </div>`;
}

function navView(){
  const r = route();
  const link = (href,label,active)=>`<a class="nav-link ${active?"active":""}" href="#${href}">${label}</a>`;
  const u = me();
  return `<header class="nav"><div class="nav-inner">
    <a class="brand" href="#/"><span class="brand-mark">🐦</span> Chirp</a>
    <nav class="nav-links">
      ${link("/","Home",r.page==="feed")}
      ${link("/explore","Explore",r.page==="explore")}
      ${link("/u/"+u.handle,"Profile",r.page==="profile" && r.handle===u.handle)}
    </nav>
    <div class="nav-right">
      <button class="btn-ghost" data-act="logout" title="Sign out">Log out</button>
      <a href="#/u/${u.handle}">${avatar(u,34)}</a>
    </div>
  </div></header>`;
}

function composerView(){
  const u = me();
  return `<form class="composer card" data-composer>
    ${avatar(u)}
    <div class="composer-body">
      <textarea class="composer-input" data-input rows="3" maxlength="300" placeholder="What's happening?"></textarea>
      <div class="composer-footer">
        <span class="char-count" data-count>280</span>
        <button type="submit" class="btn-primary" data-post disabled>Chirp</button>
      </div>
    </div>
  </form>`;
}

function commentsView(post){
  const items = post.comments.map(c=>{
    const a = getUser(c.authorId);
    return `<div class="comment">${avatar(a,30)}
      <div class="comment-body">
        <div class="comment-head"><a class="name" href="#/u/${a.handle}">${esc(a.name)}</a>
          <span class="muted">· ${timeAgo(c.createdAt)}</span></div>
        <div class="comment-text">${esc(c.text)}</div>
      </div></div>`;
  }).join("");
  return `<div class="comments">${items}
    <form class="comment-form" data-comment="${post.id}">
      <input class="comment-input" placeholder="Write a reply…" />
      <button type="submit" class="btn-small">Reply</button>
    </form></div>`;
}

function postView(post){
  const a = getUser(post.authorId);
  const liked = post.likes.includes(state.currentUserId);
  const mine = post.authorId===state.currentUserId;
  const open = ui.openComments.has(post.id);
  return `<article class="card post">${avatar(a)}
    <div class="post-body">
      <div class="post-head">
        <a class="name" href="#/u/${a.handle}">${esc(a.name)}</a>
        <span class="muted">@${esc(a.handle)}</span>
        <span class="muted">· ${timeAgo(post.createdAt)}</span>
        ${mine?`<button class="post-del" data-del="${post.id}" title="Delete">✕</button>`:""}
      </div>
      <p class="post-text">${esc(post.text)}</p>
      <div class="post-actions">
        <button class="action ${liked?"liked":""}" data-like="${post.id}">${liked?"♥":"♡"} ${post.likes.length||""}</button>
        <button class="action" data-toggle="${post.id}">💬 ${post.comments.length||""}</button>
      </div>
      ${open?commentsView(post):""}
    </div></article>`;
}

function feedView(){
  const u = me();
  let posts = [...state.posts].sort((a,b)=>b.createdAt-a.createdAt);
  if(ui.tab==="following"){
    const vis = new Set([u.id,...u.following]);
    posts = posts.filter(p=>vis.has(p.authorId));
  }
  const list = posts.length
    ? posts.map(postView).join("")
    : `<div class="empty">${ui.tab==="following"
        ? "Your following feed is quiet. Follow people on Explore, or switch to Everyone."
        : "No chirps yet. Be the first to post!"}</div>`;
  return composerView()
    + `<div class="tabs">
        <button class="tab ${ui.tab==="following"?"active":""}" data-tab="following">Following</button>
        <button class="tab ${ui.tab==="all"?"active":""}" data-tab="all">Everyone</button>
      </div>` + list;
}

function exploreView(){
  const q = ui.search.trim().toLowerCase();
  const users = state.users
    .filter(u=>u.id!==state.currentUserId)
    .filter(u=>!q || u.name.toLowerCase().includes(q) || u.handle.toLowerCase().includes(q));
  const cards = users.length ? users.map(u=>{
    const following = me().following.includes(u.id);
    return `<div class="card user-card">
      <a class="user-card-main" href="#/u/${u.handle}">${avatar(u)}
        <div><div class="name">${esc(u.name)}</div><div class="muted">@${esc(u.handle)}</div>
        ${u.bio?`<div class="user-card-bio">${esc(u.bio)}</div>`:""}</div></a>
      <button class="${following?"btn-ghost":"btn-primary"}" data-follow="${u.id}">${following?"Following":"Follow"}</button>
    </div>`;
  }).join("") : `<div class="empty">No one matches “${esc(ui.search)}”.</div>`;
  return `<h2 class="page-title">Explore people</h2>
    <input class="search" data-search placeholder="Search by name or @handle…" value="${esc(ui.search)}" />
    ${cards}`;
}

function profileView(handle){
  const u = getUserByHandle(handle);
  if(!u) return `<div class="empty">No user @${esc(handle)}. <a href="#/explore">Explore people →</a></div>`;
  const mine = u.id===state.currentUserId;
  const following = me().following.includes(u.id);
  const followers = state.users.filter(x=>x.following.includes(u.id)).length;
  const posts = state.posts.filter(p=>p.authorId===u.id).sort((a,b)=>b.createdAt-a.createdAt);
  const list = posts.length ? posts.map(postView).join("")
    : `<div class="empty">${mine?"You haven't chirped yet.":"@"+esc(u.handle)+" hasn't chirped yet."}</div>`;
  return `<div class="card profile-header">${avatar(u,72)}
    <div class="profile-meta">
      <h2 class="profile-name">${esc(u.name)}</h2>
      <div class="muted">@${esc(u.handle)}</div>
      ${u.bio?`<p class="profile-bio">${esc(u.bio)}</p>`:""}
      <div class="profile-stats">
        <span><strong>${u.following.length}</strong> Following</span>
        <span><strong>${followers}</strong> Followers</span>
        <span><strong>${posts.length}</strong> Chirps</span>
      </div>
    </div>
    ${mine?"":`<button class="${following?"btn-ghost":"btn-primary"}" data-follow="${u.id}">${following?"Following":"Follow"}</button>`}
  </div>${list}`;
}

function pageView(){
  const r = route();
  if(r.page==="explore") return exploreView();
  if(r.page==="profile") return profileView(r.handle);
  return feedView();
}

/* ---------------- render + events ---------------- */
let committing = false;
function commit(){ save(); committing = true; render(); committing = false; }

function render(){
  const root = document.getElementById("root");
  if(!me()){                 // logged out → show only the auth screen
    root.innerHTML = authView();
    wireAuth();
    return;
  }
  root.innerHTML = navView()
    + `<main class="container">${pageView()}</main>`
    + `<footer class="footer">Chirp · a tiny demo social app · data lives in your browser</footer>`;
  wire();
}

function wireAuth(){
  const root = document.getElementById("root");
  const reset = root.querySelector('[data-act="reset"]');
  if(reset) reset.onclick = resetAll;
  root.querySelectorAll("[data-authmode]").forEach(a=>{
    a.onclick = ()=>{ ui.authMode = a.getAttribute("data-authmode"); ui.authError = ""; render(); };
  });
  const form = root.querySelector("[data-auth]");
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const f = e.target.elements;
    const err = ui.authMode === "signup"
      ? signup(f["name"].value, f["handle"].value, f["password"].value)
      : login(f["handle"].value, f["password"].value);
    // On success login()/signup() already re-rendered the app; only handle errors here.
    if(err){ ui.authError = err; render(); }
  });
  const first = root.querySelector(".auth-input");
  if(first) setTimeout(()=>first.focus(),0);
}

function wire(){
  const root = document.getElementById("root");

  // logout
  const out = root.querySelector('[data-act="logout"]');
  if(out) out.onclick = logout;

  // composer
  const form = root.querySelector("[data-composer]");
  if(form){
    const input = form.querySelector("[data-input]");
    const count = form.querySelector("[data-count]");
    const btn = form.querySelector("[data-post]");
    const upd = ()=>{
      const rem = 280 - input.value.length;
      count.textContent = rem;
      count.classList.toggle("over", rem<0);
      btn.disabled = !(input.value.trim() && rem>=0);
    };
    input.addEventListener("input", upd);
    form.addEventListener("submit", e=>{ e.preventDefault(); if(input.value.trim()) addPost(input.value); });
    setTimeout(()=>input.focus(),0);
  }

  // tabs
  root.querySelectorAll("[data-tab]").forEach(b=>{
    b.onclick = ()=>{ ui.tab = b.getAttribute("data-tab"); render(); };
  });

  // like / delete / toggle comments
  root.querySelectorAll("[data-like]").forEach(b=> b.onclick = ()=> toggleLike(b.getAttribute("data-like")));
  root.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=> deletePost(b.getAttribute("data-del")));
  root.querySelectorAll("[data-toggle]").forEach(b=> b.onclick = ()=>{
    const id = b.getAttribute("data-toggle");
    ui.openComments.has(id) ? ui.openComments.delete(id) : ui.openComments.add(id);
    render();
  });

  // comment forms
  root.querySelectorAll("[data-comment]").forEach(f=>{
    f.addEventListener("submit", e=>{
      e.preventDefault();
      const input = f.querySelector(".comment-input");
      if(input.value.trim()) addComment(f.getAttribute("data-comment"), input.value);
    });
  });

  // follow buttons
  root.querySelectorAll("[data-follow]").forEach(b=> b.onclick = ()=> toggleFollow(b.getAttribute("data-follow")));

  // search (preserve focus + caret across re-render)
  const search = root.querySelector("[data-search]");
  if(search){
    search.addEventListener("input", ()=>{
      ui.search = search.value;
      const pos = search.selectionStart;
      render();
      const s2 = document.querySelector("[data-search]");
      if(s2){ s2.focus(); try{ s2.setSelectionRange(pos,pos); }catch(e){} }
    });
  }
}

window.addEventListener("hashchange", render);
load();
// Always open on the sign-in form; users can switch to sign-up from there.
ui.authMode = "signin";
render();
</script>
</body>
</html>
